<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmara de Comércio de São Paulo - Início</title>
    <!-- Caminhos corretos para os arquivos CSS e media query para telas grandes -->
    <link rel="stylesheet" href="estilos/normalize.css">
    <link rel="stylesheet" href="estilos/pequeno.css">
    <link rel="stylesheet" href="estilos/grande.css" media="(min-width: 768px)">
    <!-- Caminho correto para o script na pasta scripts -->
    <script src="scripts/home.js" defer></script>
</head>
<body>

    <header>
        <div class="site-title">Câmara de Comércio de São Paulo</div>
        <nav>
            <ul id="primary-nav">
                <li><a href="index.html" class="active">Início</a></li>
                <li><a href="diretorio.html">Diretório</a></li>
                <li><a href="join.html">Junte-se a Nós</a></li>
                <li><a href="contact.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Imagem Principal (Hero) e CTA sobreposta -->
        <section class="hero-container">
            <img src="imagens/hero.jpg" alt="Visão panorâmica do centro comercial da cidade" loading="eager">
            <div class="hero-cta">
                <h2>Impulsione seu Negócio</h2>
                <a href="join.html" class="cta-button">Associe-se Agora</a>
            </div>
        </section>

        <!-- Seção de Clima -->
        <section class="weather-section">
            <h2>Clima Atual e Previsão</h2>
            <div id="weather-card"></div>
            <div id="forecast-container"></div>
        </section>

        <!-- Seção de Empresas em Destaque -->
        <section class="spotlights-section">
            <h2>Empresas em Destaque</h2>
            <div id="spotlights-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> Câmara de Comércio de São Paulo</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
