<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD231 Certificate Course Work portfolio and dynamic course list developed by Danilo Rafael da Silva Costa.">
    <meta name="author" content="Danilo Rafael da Silva Costa">
    <meta name="robots" content="index, follow">
    <title>WDD231 - Certificate Course Work</title>
    <link rel="stylesheet" href="styles.css">
    <script src="courses.js" defer></script>
</head>
<body>
    <header>
        <h1>WDD231 - Web Frontend Development</h1>
        <nav aria-label="Main Navigation">
            <a href="index.html" class="active">Home</a>
            <a href="certificate.html">Certificado</a>
            <a href="projects.html">Projetos</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Certificado de Desenvolvimento Web</h2>
            <p>Lista de cursos cursados e planejados para o certificado WDD231.</p>
            
            <!-- Filtros de Cursos -->
            <div class="filter-buttons" role="group" aria-label="Course Filters">
                <button id="all-btn" type="button">All</button>
                <button id="wdd-btn" type="button">WDD</button>
                <button id="cse-btn" type="button">CSE</button>
            </div>

            <!-- Container onde os cursos serão injetados dinamicamente via JS -->
            <div id="courses-container" class="courses-grid"></div>

            <!-- Exibição do total de créditos usando reduce() -->
            <div class="credits-summary">
                <p>Total de créditos das matérias exibidas: <span id="total-credits">0</span></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="anoatual"></span> | Danilo Rafael da Silva Costa | Brasil</p>
        <p>Última modificação: <span id="ultimamodificacao"></span></p>
    </footer>
</body>
</html>
